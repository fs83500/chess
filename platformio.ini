; PlatformIO project for the automated chess board (ESP32)
; The chess engine core is portable C++ so it can be unit-tested on the host.
; The hardware layer targets the ESP32.

[platformio]
default_envs = esp32dev

; --- Target running on the real ESP32 board ---
[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  madhephaestus/ESP32Servo @ ^2.0.0
build_src_filter  = +<*> -<host_tests.cpp>

; --- Host environment to run chess-engine unit tests without hardware ---
; Usage: pio test -e native
[env:native]
platform          = native
build_flags       = -std=gnu++17 -DUNIT_TEST -Isrc
test_build_src    = true
build_src_filter  = +<chess/*> +<host_tests.cpp>
; Provide a stub Arduino.h so the host build can still parse hardware includes
; when needed. The engine tests only use chess/* so this is informational.
